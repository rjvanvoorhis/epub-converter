[pytest]
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests with no external dependencies
    integration: Integration tests (marked but not run by default)
    e2e: End-to-end tests (marked but not run by default)
